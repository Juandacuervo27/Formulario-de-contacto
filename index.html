<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <div>
        <header>
            <h1>Formulario de Contacto</h1>
            <p>¿Tienes una propuesta, duda o idea? Escríbeme.</p>
        </header>
    </div>
<section>
    <article>
        <h2>Envíame un mensaje</h2>
        <div>
            <form action="#" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required placeholder="Tu apellido">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tipo_doc">Tipo de documento</label>
                    <select id="tipo_doc" name="tipo_doc" required>
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="13">Cédula de Ciudadanía</option>
                        <option value="22">Cédula de Extranjería</option>
                        <option value="12">Tarjeta de Identidad</option>
                        <option value="41">Pasaporte</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dni">Número de Documento (DNI)</label>
                    <input type="text" id="dni" name="dni" required placeholder="Número de identificación">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="fecha_nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required placeholder="AAAA-MM-DD">
                </div>
                <div class="form-group">
                    <label for="telefono">Número de teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="+57 300 000 0000">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="pais">País de domicilio</label>
                    <select id="pais" name="pais" required>
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="169">Colombia</option>
                        <option value="249">Estados Unidos</option>
                        <option value="245">España</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ciudad">Ciudad de domicilio</label>
                    <select id="ciudad" name="ciudad" required>
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="11001">Bogotá, D.C.</option>
                        <option value="05001">Medellín</option>
                        <option value="76001">Cali</option>
                        <option value="08001">Barranquilla</option>
                        <option value="13001">Cartagena</option>
                    </select>
                </div>
            </div>

            <div class="form-group consent-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="tratamiento_datos" name="tratamiento_datos" required>
                    <span>Acepto la política de <a href="#" class="link-policy">tratamiento de datos personales</a>.</span>
                </label>
            </div>

            <button type="submit">Enviar mensaje</button>
        </form>
        </div>
    </article>
</section>

<footer>
    © 2026 · Formulario de contacto
</footer>
</body>
</html>
